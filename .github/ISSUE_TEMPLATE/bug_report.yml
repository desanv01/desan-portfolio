name: Bug report
description: Report reproducible unexpected behavior.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: Remove secrets and private data. Follow SECURITY.md for sensitive reports.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Revision and environment
      description: Include the commit, runtime versions and relevant browser or operating system.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and impact
