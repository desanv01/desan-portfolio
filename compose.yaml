name: desan-website

services:
  postgres:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_USER: desan
      POSTGRES_DB: desan_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private local POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U desan -d desan_dev']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
